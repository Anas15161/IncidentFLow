spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/IncidentFlow_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:IncidentFlow_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:incidentflow_secure_db_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# Optimisation du pool de connexions HikariCP (reduction empreinte mémoire)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000

# Optimisation mémoire JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Profil actif par défaut
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev-mock}

